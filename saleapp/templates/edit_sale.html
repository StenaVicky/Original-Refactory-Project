{% extends 'base.html' %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header text-white py-3" style="background-color: #1a5f7a;">
                    <h4 class="mb-1 text-center">Edit Sale</h4>
                </div>
                <div class="card-body p-4">
                    <form method="POST" id="edit-sale-form">
                        {% csrf_token %}

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Customer Name (optional)</label>
                                <input type="text" name="customer_name" value="{{ sale.customer_name }}" class="form-control form-control-sm">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Distance</label>
                                <input type="text" name="distance" value="{{ sale.distance }}" class="form-control form-control-sm">
                                {% if errors.distance %}
                                    <div class="text-danger small">{{ errors.distance }}</div>
                                {% endif %}
                            </div>
                        </div>

                        <div id="sale-items">
                            {% for item in items %}
                            <div class="row g-3 align-items-end sale-item-row mb-2">
                                <div class="col-md-7">
                                    <label class="form-label">Product</label>
                                    <select name="product[]" class="form-select form-select-sm">
                                        <option value="">Select product</option>
                                        {% for product in products %}
                                        <option value="{{ product.id }}" {% if product.id == item.product.id %}selected{% endif %}>
                                            {{ product.product_name }} | {{ product.unit_price }} | Stock: {{ product.current_stock }}
                                        </option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Quantity</label>
                                    <input type="text" name="quantity[]" value="{{ item.quantity }}" class="form-control form-control-sm">
                                </div>
                                <div class="col-md-2 text-end">
                                    <button type="button" class="btn btn-outline-danger btn-sm remove-item">X</button>
                                </div>
                            </div>
                            {% endfor %}
                        </div>

                        <div class="mb-3">
                            <button type="button" id="add-item" class="btn btn-link btn-sm">+ Add product</button>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary btn-sm">Save Changes</button>
                            <a href="{% url 'home' %}" class="btn btn-outline-danger btn-sm">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const productOptions = `{% for product in products %}<option value="{{ product.id }}">{{ product.product_name }} | {{ product.unit_price }} | Stock: {{ product.current_stock }}</option>{% endfor %}`;
const container = document.getElementById('sale-items');
const addBtn = document.getElementById('add-item');

addBtn.onclick = () => {
    const div = document.createElement('div');
    div.className = 'row g-3 align-items-end sale-item-row mb-2';
    div.innerHTML = `
        <div class="col-md-7"><label class="form-label">Product</label><select name="product[]" class="form-select form-select-sm"><option value="">Select product</option>${productOptions}</select></div>
        <div class="col-md-3"><label class="form-label">Quantity</label><input type="text" name="quantity[]" class="form-control form-control-sm" value="1"></div>
        <div class="col-md-2 text-end"><button type="button" class="btn btn-outline-danger btn-sm remove-item">X</button></div>
    `;
    container.appendChild(div);
};

container.onclick = (e) => {
    if (e.target.classList.contains('remove-item') && container.children.length > 1) {
        e.target.closest('.sale-item-row').remove();
    }
};
</script>
{% endblock %}
