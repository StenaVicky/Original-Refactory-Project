{% extends 'base.html' %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="card shadow-sm border-0" style="font-size: 0.95rem;">
                <div class="card-header bg-primary text-white py-3">
                    <h4 class="mb-1 fw-semibold text-center">Edit Sale</h4>
                    <p class="mb-0 small text-white-75 text-center">Update the sale details and save changes.</p>
                </div>
                <div class="card-body p-4">
                    <form method="POST" id="edit-sale-form">
                        {% csrf_token %}

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-medium">Customer Name (optional)</label>
                                <input type="text" name="customer_name" value="{{ sale.customer_name }}" class="form-control form-control-sm" placeholder="Walk-in Customer">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-medium">Distance</label>
                                <input type="number" name="distance" value="{{ sale.distance }}" class="form-control form-control-sm" min="1" step="0.01" required>
                            </div>
                        </div>

                        <div id="sale-items">
                            {% for item in items %}
                            <div class="row g-3 align-items-end sale-item-row">
                                <div class="col-md-7">
                                    <label class="form-label small fw-medium">Product</label>
                                    <select name="product" class="form-select form-select-sm" required>
                                        <option value="">Select product</option>
                                        {% for product in products %}
                                        <option value="{{ product.id }}" {% if product.id == item.product.id %}selected{% endif %}>{{ product.product_name }} | {{ product.category_name.category_name }} | {{ product.unit_price }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label small fw-medium">Quantity</label>
                                    <input type="number" name="quantity" value="{{ item.quantity }}" class="form-control form-control-sm" min="1" required>
                                </div>
                                <div class="col-md-2 text-end">
                                    <button type="button" class="btn btn-outline-danger btn-sm remove-item">Remove</button>
                                </div>
                            </div>
                            {% endfor %}
                        </div>

                        <div class="mb-4">
                            <button type="button" id="add-item" class="btn btn-link btn-sm">+ Add another product</button>
                        </div>

                        <div class="d-flex gap-2 flex-wrap">
                            <button type="submit" class="btn btn-primary btn-sm px-4">Save Changes</button>
                            <a href="{% url 'home' %}" class="btn btn-outline-danger btn-sm px-4">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const saleItemsContainer = document.getElementById('sale-items');
const addItemButton = document.getElementById('add-item');

function createSaleItemRow() {
    const row = document.createElement('div');
    row.className = 'row g-3 align-items-end sale-item-row';
    row.innerHTML = `
        <div class="col-md-7">
            <label class="form-label small fw-medium">Product</label>
            <select name="product" class="form-select form-select-sm" required>
                <option value="">Select product</option>
                {% for product in products %}
                <option value="{{ product.id }}">{{ product.product_name }} | {{ product.category_name.category_name }} | {{ product.unit_price }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-3">
            <label class="form-label small fw-medium">Quantity</label>
            <input type="number" name="quantity" class="form-control form-control-sm" min="1" value="1" required>
        </div>
        <div class="col-md-2 text-end">
            <button type="button" class="btn btn-outline-danger btn-sm remove-item">Remove</button>
        </div>
    `;
    return row;
}

addItemButton.addEventListener('click', () => {
    const row = createSaleItemRow();
    saleItemsContainer.appendChild(row);
});

saleItemsContainer.addEventListener('click', (event) => {
    if (event.target.classList.contains('remove-item')) {
        const row = event.target.closest('.sale-item-row');
        if (saleItemsContainer.querySelectorAll('.sale-item-row').length > 1) {
            row.remove();
        }
    }
});
</script>
{% endblock %}
