{% extends 'base.html' %}

{% block content %}

<div class="card mb-4" style="background: linear-gradient(135deg, #1a5f7a 0%, #0d3d4f 100%); color: white;">
        <div class="card-body">
            <h3 class="mb-0">📦 Category</h3>
            <i class="bi bi-tags"></i><small>Categories at NYONDO Hardware</small>
        </div>
    
</div>
<a href="{% url 'create_category' %}" class="btn btn-primary">Add Category</a>

<table class="table table-bordered table-striped shadow-sm">
    <thead class="table-dark">
        <tr>
            <th>Category Name</th>
            <th>Slug</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody>
        {% for category in categories %}
        <tr>
            <td>{{ category.category_name }}</td>
            <td>{{ category.slug }}</td>
            <td>
                <a href="{% url 'delete_category' category.id %}" class="btn btn-danger btn-sm">
                    Delete
                </a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3" class="text-center">No categories found.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
