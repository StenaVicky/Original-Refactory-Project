{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardware Sales</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
   <style>

        @media print {
            .sidebar,
            nav,
            footer,
            .no-print {
                display: none;
            }

            .main-content {
                margin-left: 0 !important;
            }
        }

        body {
            background-color: #f8f9fa;
        }

        /* Top Navbar */

        .top-navbar {
            height: 60px;
            z-index: 1000;
        }

        /* Sidebar */

        .sidebar {
            width: 250px;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 60px;
            background-color: #212529;
            padding-top: 20px;
            border-radius: 5px;
            
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 14px 20px;
            transition: 0.3s;
            
        }

        .sidebar a:hover {
            background-color: #495057;
        }

        /* Main Content */

        .main-content {
            margin-left: 250px;
            margin-top: 60px;
            padding: 30px;
        }

        /* Sales Table */

        .sales-table {
            white-space: nowrap;
        }

        .sales-table th,
        .sales-table td {
            white-space: nowrap;
        }

        footer {
            margin-left: 250px;
        }

    </style>
</head>

<body class="bg">

    <nav class="navbar top-navbar fixed-top navbar-dark" style="background-color: #1a5f7a;">
        <div class="container_fluid">
            <a href="{% url 'home' %}" class="navbar-brand fw-bold" style="font-family:sans-serif"><img src="{% static 'stenalogo.png' %}" alt="logo" width="70px" height="70px" class="me-2 rounded-circle"> Nyondo Hardware
                System </a>
                


        </div>
    </nav>
   
    <div class="sidebar" style="border-radius: 5px; top: 60px;">
        
        <a href="{% url 'home' %}" class="btn btn-info btn-sm"><i class="bi bi-cart"></i> Sales</a><br>
        <a href="{% url 'category_list' %}" ><i class="bi bi-list"></i> Categories</a><br>
        <a href="{% url 'product_list' %}" ><i class="bi bi-box"></i> Products</a><br>
        <a href="{% url 'stock_receipt_list' %}" ><i class="bi bi-truck"></i> Stock</a><br>
        <a href="{% url 'scheme_customer_list' %}" ><i class="bi bi-percent"></i> Schemes</a><br>

    </div>
    <main class="main-content">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="mt-5 mb-1">
        <p style="text-align: center; background-color: #1a5f7a; font-family: geneva;">Nyondo Hardware System
            Kampala-Nansana All rights resrved &copy; 2020-2026</p>

    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
