{% extends 'base.html' %}

{% block content %}
<div class="container text-center mt-5">
    <div class="card">
        <div class="card-header" style="background-color: #e86a2c; color: white;">
            <h4>Confirm Logout</h4>
        </div>
        <div class="card-body">
            <p>Are you sure you want to logout?</p>
            <a href="{% url 'login_view' %}" class="btn btn-danger">Yes, Logout</a>
            <a href="{% url 'dashboard' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </div>
</div>
{% endblock %}
