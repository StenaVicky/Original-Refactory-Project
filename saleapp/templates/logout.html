{% block content %}
<div class="container text-center mt-5">
    <div class="card">
        <div class="card-header" style="background-color: #eb0c1f; color: white;">
            <h4>Confirm Logout</h4>
        </div>
        <div class="card-body">
            <p>Are you sure you want to logout?</p>
            <a href="{% url 'login_view' %}" class="btn btn-danger">Yes, Logout</a>
            <a href="{% url 'dashboard' %}" class="btn btn-secondary">Cancel</a>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-sm-10 col-md-8 col-lg-6">
            <div class="card shadow-sm border-0" style="font-size: 0.95rem; ">
                <div class="card-header text-white py-3 d-flex align-items-center gap-2" style="background-color: #1a5f7a;">
                    <i class="bi bi-box-arrow-right fs-4"></i>
                    <div>
                        <h5 class="mb-0 fw-semibold">Confirm Logout</h5>
                        <p class="mb-0 small text-white-75">You will be returned to the login screen.</p>
                    </div>
                </div>
                <div class="card-body p-4 text-center">
                    <p class="mb-4">Are you sure you want to log out of the NYONDO Hardware system?</p>
                    <div class="d-flex justify-content-center gap-2 flex-wrap">
                        <a href="{% url 'login' %}" class="btn btn-danger btn-sm px-4">Yes, Logout</a>
                        <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary btn-sm px-4">Cancel</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
