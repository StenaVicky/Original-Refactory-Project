<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NYONDO Hardware</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #1a5f7a 0%, #0d3d4f 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .logo {
            width: 70px;
            height: 70px;
            background: #e86a2c;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
        }

        .logo i {
            font-size: 35px;
            color: white;
        }

        h3 {
            color: #1a5f7a;
            margin-bottom: 5px;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
        }

        .form-control:focus {
            border-color: #e86a2c;
            box-shadow: 0 0 0 2px rgba(232, 106, 44, 0.2);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: #1a5f7a;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-login:hover {
            background: #0d3d4f;
        }

        .alert {
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .alert-danger {
            background: #fee;
            color: #c00;
        }

        .demo {
            margin-top: 20px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 10px;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <div class="login-box">
        <div class="logo">
            <img src="../static/stenalogo.png" alt="logo" width="50px" height="50px" style="background-color: #1a5f7a;" class="rounded-circle">
        </div>

        <h3>NYONDO Hardware</h3>
        <p style="color: #666; margin-bottom: 25px;">Stock Management System</p>
        <!--         
        {% if form.errors %}
       
        {% endif %} -->

        <form method="post">
            {% csrf_token %}
            <input type="text" name="username" class="form-control" placeholder="Username" required>
            <input type="password" name="password" class="form-control" placeholder="Password" required>
            <input type="checkbox" name="remember me">
            <label for="remember me" style="color: #666; font-size: 14px; align-items: left;">Remember Me</label>
            <br><br>
            <button type="submit" class="btn-login">Login</button>
           <div class="text-center mt-3">
        <a href="{% url 'sign_up' %}" style="color: #392ce8;">Don't have an account? <br>Signup here</a>
        </div>
        </form>


    </div>
</body>

</html>
