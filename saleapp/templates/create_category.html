{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card shadow-sm mt-5">
            <div class="card-header text-white" style="background-color: #1a5f7a;">
                <div class="d-flex align-items-center justify-content-between">
                    <div>
                        <h3 class="mb-1">Add New Category</h3>
                        <small class="text-white-75">Create a category to organize your products.</small>
                    </div>
                    <i class="bi bi-tags fs-2"></i>
                </div>
            </div>
            <div class="card-body">
                {% if error %}
                <div class="alert alert-danger">
                    {{ error }}
                </div>
                {% endif %}

                <form method="POST" class="mt-3">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Category Name</label>
                        <input type="text" name="category_name" class="form-control form-control-lg" placeholder="Enter category name">
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Slug</label>
                        <input type="text" name="slug" class="form-control form-control-lg" placeholder="enter-category-slug">
                        <div class="form-text">The URL-friendly version of the category name.</div>
                    </div>

                    <div class="d-flex flex-column flex-sm-row gap-2">
                        <button type="submit" class="btn btn-primary btn-lg w-100">Save Category</button>
                        <a href="{% url 'category_list' %}" class="btn btn-outline-secondary btn-lg w-100">Cancel</a>
                    </div>
                </form>
            </div>
            <!-- <div class="card-footer bg-light text-muted">
                Categories help keep your products organized and easier to manage.
            </div> -->
        </div>
    </div>
</div>
{% endblock %}
