{% extends 'base.html' %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="card shadow-sm border-0" style="font-size: 0.95rem;">
                <div class="card-header  text-white py-3" style="background-color: #1a5f7a;">
                    <h4 class="mb-1 fw-semibold text-center">Add Product</h4>
                    <p class="mb-0 small text-white-75 text-center">Add a new product and link it to an existing category.</p>
                </div>
                <div class="card-body p-4">
                    <form method="POST">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label small fw-medium">Category</label>
                            <select name="category" class="form-select form-select-sm">
                                <option value="">Select category</option>
                                {% for category in categories %}
                                <option value="{{ category.id }}">{{ category.category_name }}</option>
                                {% endfor %}
                            </select>
                          
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-medium">Product Name</label>
                            <input type="text" name="product_name" class="form-control form-control-sm">
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-medium">Current Unit Price</label>
                            <input type="text" value="Will be updated from stock receipt" class="form-control form-control-sm" readonly>
                            <div class="form-text small text-muted">Unit price is set when stock is received.</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-medium">Description</label>
                            <textarea name="description" class="form-control form-control-sm" rows="4"></textarea>
                        </div>

                        <div class="d-flex gap-2 flex-wrap">
                            <button type="submit" class="btn btn-success btn-sm px-4">Save Product</button>
                            <a href="{% url 'product_list' %}" class="btn btn-outline-secondary btn-sm px-4">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
