{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardware Sales</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --brand-blue: #1a5f7a;
            --brand-orange: #e86a2c;
            --brand-black: #000000;
            --message-red: #dc3545;
            --message-green: #198754;
        }

        body {
            color: var(--brand-black);
        }

        .card-header,
        .table-dark th,
        .table-dark td {
            background-color: var(--brand-blue) !important;
            color: #ffffff !important;
        }

        .btn-primary,
        .btn-success,
        .btn-info,
        .btn-dark {
            border-color: var(--brand-blue) !important;
            background-color: var(--brand-blue) !important;
            color: #ffffff !important;
        }

        .btn-secondary,
        .btn-warning,
        .btn-light {
            border-color: var(--brand-orange) !important;
            background-color: var(--brand-orange) !important;
            color: #ffffff !important;
        }

        .btn-danger {
            border-color: var(--brand-black) !important;
            background-color: var(--brand-black) !important;
            color: #ffffff !important;
        }

        .btn-outline-primary,
        .btn-outline-secondary,
        .btn-outline-danger,
        .btn-outline-dark {
            border-color: var(--brand-blue) !important;
            color: var(--brand-blue) !important;
        }

        .btn-outline-primary:hover,
        .btn-outline-secondary:hover,
        .btn-outline-danger:hover,
        .btn-outline-dark:hover {
            background-color: var(--brand-blue) !important;
            color: #ffffff !important;
        }

        .badge.bg-primary,
        .badge.bg-success,
        .badge.bg-secondary,
        .badge.bg-info,
        .badge.bg-warning {
            background-color: var(--brand-orange) !important;
            color: #ffffff !important;
        }

        .badge.bg-danger,
        .badge.bg-dark {
            background-color: var(--brand-black) !important;
            color: #ffffff !important;
        }

        .text-primary,
        .text-info,
        .text-secondary,
        .text-muted {
            color: var(--brand-black) !important;
        }

        .text-danger {
            color: var(--brand-orange) !important;
        }

        .text-success {
            color: var(--brand-blue) !important;
        }

        .alert-danger {
            border-color: var(--message-red) !important;
            background-color: var(--message-red) !important;
            color: #ffffff !important;
        }

        .alert-success {
            border-color: var(--message-green) !important;
            background-color: var(--message-green) !important;
            color: #ffffff !important;
        }

        .alert-warning,
        .alert-info,
        .alert-primary,
        .alert-secondary {
            border-color: var(--brand-orange) !important;
            background-color: var(--brand-orange) !important;
            color: #ffffff !important;
        }

        .bi {
            color: currentColor;
        }

        .message-popup {
            position: fixed;
            top: 86px;
            right: 24px;
            z-index: 1080;
            width: min(420px, calc(100vw - 32px));
        }

        .message-popup .alert {
            border-radius: 8px;
            box-shadow: none;
            line-height: 1.45;
            overflow-wrap: anywhere;
            word-break: normal;
        }

        @media (max-width: 576px) {
            .message-popup {
                left: 16px;
                right: 16px;
                width: auto;
            }
        }

        .site-footer {
            margin-left: 250px;
            margin-top: 16px;
            padding: 14px 16px 10px;
            background-color: #1a5f7a;
            color: white;
            text-align: center;
            font-size: 0.85rem;
        }

        .site-footer h6 {
            margin-bottom: 4px;
            color: #e86a2c;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .site-footer p {
            margin-bottom: 2px;
        }

        .site-footer hr {
            max-width: 280px;
            margin: 8px auto;
            border-color: #ffffff;
        }
    </style>
</head>

<body class="bg">

    {% include 'nav.html' %}

    <main class="main-content">
        {% if messages %}
            <div class="message-popup">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        {% block content %}
        {% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            <h6>NYONDO Hardware</h6>
            <p>Nansana-Kampala</p>
            <p>Tel: +256 759795859</p>
            
            <hr>
            <small>&copy; 2026 NYONDO Hardware. All rights reserved.</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function goBackToPreviousPage() {
            if (window.history.length > 1) {
                window.history.back();
                return;
            }

            window.location.href = "{% url 'home' %}";
        }
    </script>

</body>

</html>
