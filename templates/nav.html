{% load static %}

<style>
    @media print {
        .sidebar,
        nav,
        footer,
        .no-print {
            display: none;
        }

        .main-content {
            margin-left: 0 !important;
        }
    }

    body {
        background-color: #f8f9fa;
    }

    .top-navbar {
        height: 70px;
        z-index: 1000;
        background-color: #1a5f7a;
    }

    .sidebar {
        width: 250px;
        height: 100vh;
        position: fixed;
        top: 70px;
        left: 0;
        background-color: #1a5f7a;
        padding-top: 20px;
    }

    .sidebar a {
        display: block;
        padding: 14px 20px;
        color: white;
        text-decoration: none;
        transition: 0.3s;
    }

    .sidebar a:hover {
        background-color: #e86a2c;
    }

    .main-content {
        margin-left: 250px;
        margin-top: 70px;
        padding: 30px;
    }

    .sales-table,
    .sales-table th,
    .sales-table td {
        white-space: nowrap;
    }

    footer {
        margin-left: 250px;
    }
</style>

<!-- Navbar -->
<nav class="navbar navbar-dark top-navbar fixed-top">

    <div class="container-fluid d-flex justify-content-between align-items-center">

        <!-- Logo -->
        <a href="{% url 'home' %}"
           class="navbar-brand fw-bold d-flex align-items-center">

            <img src="{% static 'stenalogo.png' %}"
                 alt="logo"
                 width="60"
                 height="60"
                 class="rounded-circle me-2">

            Nyondo Hardware System

        </a>

        <!-- User Section -->
        <div class="d-flex align-items-center">

            {% if user.is_authenticated %}

                <span class="text-white me-3">
                    Welcome, {{ user.username }}
                </span>

                <form action="{% url 'logout' %}" method="POST" class="m-0">
                    {% csrf_token %}

                    <button type="submit" class="btn btn-danger btn-sm">
                        Logout
                    </button>
                </form>

            {% else %}

                <a href="{% url 'login' %}"
                   class="btn btn-outline-light btn-sm me-2">
                    Login
                </a>

                <a href="{% url 'register' %}"
                   class="btn btn-warning btn-sm">
                    Register
                </a>

            {% endif %}

        </div>

    </div>

</nav>

<!-- Sidebar -->
<div class="sidebar">

    <a href="{% url 'dashboard' %}">
        <i class="bi bi-speedometer2"></i> Dashboard
    </a>

    <a href="{% url 'home' %}">
        <i class="bi bi-cart"></i> Sales
    </a>

    <a href="{% url 'category_list' %}">
        <i class="bi bi-list"></i> Categories
    </a>

    <a href="{% url 'product_list' %}">
        <i class="bi bi-box"></i> Products
    </a>

    <a href="{% url 'stock_receipt_list' %}">
        <i class="bi bi-truck"></i> Stock
    </a>

    <a href="{% url 'scheme_customer_list' %}">
        <i class="bi bi-percent"></i> Schemes
    </a>

    <a href="{% url 'supplier_report' %}">
        <i class="bi bi-truck me-2"></i> Supplier Report
    </a>

    <a href="{% url 'customer_report' %}">
        <i class="bi bi-people me-2"></i> Customer Report
    </a>

</div>
