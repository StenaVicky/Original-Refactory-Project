{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nyondo Hardware System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background-color:#f8f9fa;
        }

        .top-navbar{
            background-color:#1a5f7a;
        }

        .auth-container{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding-top:80px;
        }

    </style>
</head>

<body>

    <nav class="navbar top-navbar navbar-dark fixed-top">
        <div class="container-fluid">

            
            <a href="{% url 'home' %}" class="navbar-brand fw-bold">

                <img src="{% static 'stenalogo.png' %}"
                     alt="logo"
                     width="60"
                     height="60"
                     class="rounded-circle me-2">

                Nyondo Hardware System

            </a>

            
            <div class="d-flex">

                <a href="{% url 'login' %}"
                   class="btn btn-outline-light me-2">
                    Login
                </a>

                <a href="{% url 'register' %}"
                   class="btn btn-warning">
                    Register
                </a>

            </div>

        </div>
    </nav>

    <div class="auth-container">
        {% block content %}
        {% endblock %}
    </div>
    
</body>
</html>
