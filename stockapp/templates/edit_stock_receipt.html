 {% extends "base.html"%}
 {% block content %}

 <div class="card shadow-sm">
    <div class="card-header bg-primary text-white">
    </div>

    <div class="card-body">
        <form method= "POST">
        {% csrf_token %}

        <div  class="mb-3">
        <label class="form-label">Product</label>
        <select name="product" class="form-select"required>
            {% for product in products %}
            <option value="{{product.id}}"{%if receipt.product.id == product.id %}selected{% endif %}>
            {{product.product_name }}
        </option>
        {% endfor %}
    </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Supplier Name</label>
        <input type="text" name="supplier_name" value="{{receipt.supplier_name}}" class="form-control" required>
 </div>

 <div class="mb-3">
    <label class="form_label">selling_price</label>
    <input type="number" name="unit_cost" step="0.01" value="{{receipts.selling_price}}" class="form-control" required>
    <small class="text-muted">
        Updating this will update the product's current selling price.
    </small>
    <div class="mb-3">
        <label  class="form-label">Unit Cost</label>
        <input type="number" name="unit_cost" step="0.01" value="{{receipt.unit_cost}}" class="form-control" required>
        <small class="text-muted">
            Updating this will update the product's current cost price
        </small>

    </div>
    <div class="form-check mb-3">
        <input type="checkbox" name="supplier_paid" class="form-check-input" id="supplier_paid"
        {% if receipt.supplier_paid %}checked{% endif %}>
        <label class="form-check-label" for="supplier_paid">
            Supplier has been paid
        </label>

    </div>
    <button type="submit" class="btn btn-primary">Update Receipt</button>
    <a href="{% url 'stock_receipt_list' %}" class="btn btn-secondary"> Cancel</a>
</form>
 </div>
 </div>
 {% endblock %}
