{% extends 'base.html' %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-header text-white" style="background-color: #1a5f7a;">
        <h4 class="mb-0">Add Stock Receipt</h4>
    </div>
    <div class="card-body">
        <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Product</label>
            <select name="product" class="form-select">
                <option value="">Select product</option>

                {% for product in products %}
                <option value="{{product.id }}">
                    {{product.product_name }}| Current Price:{{product.unit_price}}
                </option>
                {% endfor %}
            </select>
        </div>


        <div class="mb-3">
            <label class="form-label">Supplier Name</label>
            <input type="text" name="supplier_name" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form=control">Quantity Received</label>
            <input type="text" name="quantity_received" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Unit Cost</label>
            <input type="text" name="unit_cost" class="form-control">
            <small class="text-muted">This will update the product's current unit cost.</small>
        </div>

        <div class="mb-3">
            <label class="form-label">Selling Price</label>
            <input type="text" name="selling_price" class="form-control">
            <small class="text-muted">This will update the product's current selling price.</small>
        </div>

             <div class="form-check mb-3">
                <input type="checkbox" name="supplier_paid" class="form-check-input" id="supplier_paid">
                <label class="form-check-label" for="supplier_paid">
                    Supplier has been paid
                </label>
            </div>

<button type="submit"class= "btn btn-primary">Save Receipt</button>
<a href="{% url 'stock_receipt_list' %}" class="btn btn-danger">Cancel</a>
    
        </form>

    </div>

</div>
{% endblock %}
