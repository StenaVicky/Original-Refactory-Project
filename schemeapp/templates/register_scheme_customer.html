{% extends 'base.html' %}

{% block content %}

<div class="card shadow-sm">

    <div class="card-header bg-success text-white">
        <h3 class="mb-0">Register Scheme Customer</h3><i class="bi bi-credit-card"></i>
        
    </div>

    <div class="card-body">
    {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-danger alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}

        <form method="POST">

            {% csrf_token %}
            

            <div class="mb-3">
                <label class="form-label">Full Name</label>

                <input type="text"
                       name="full_name"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">NIN Number</label>

                <input type="text" name="nin_number" class="form-control" required minlength="14" maxlength="14" pattern="[A-Z0-9]{14}" title="Enter a valid 14-character NIN">
            </div>

            <div class="mb-3">
                <label class="form-label">Phone Number</label>

                <input type="text" name="phone_number" class="form-control" required pattern="^(?:\+256|256|0)(7[0-9]{8}|2[0-9]{8})$" title="Enter a valid Ugandan phone number">
            </div>

            <div class="mb-6">
                <label class="form-label">Address</label>

                <textarea name="address"
                          rows="3"
                          class="form-control"
                          required></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Occupation</label>

                <input type="text"
                       name="occupation"
                       class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Employer Name</label>

                <input type="text"
                       name="employer_name"
                       class="form-control">
            </div>
            <div class="mb-3">
    <label for="payment_plan" class="form-label">Payment Plan *</label>
    <select name="payment_plan" id="payment_plan" class="form-select" required>
        <option value="">Select Payment Plan</option>
        <option value="Monthly">Monthly</option>
        <option value="Weekly">Weekly</option>
        <option value="Quarterly">Quarterly</option>
        <option value="Lump Sum">Lump Sum</option>
    </select>
</div>

            <button type="submit"
                    class="btn btn-success">
                Register Customer
            </button>

            <a href="{% url 'scheme_customer_list' %}"
               class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>
</div>

{% endblock %}
