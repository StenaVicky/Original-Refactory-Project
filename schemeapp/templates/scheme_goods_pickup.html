{% extends 'base.html' %}
{% load humanize %}


{% block content %}

<div class="card shadow-sm">

    <div class="card-header  text-white" style="background-color: #1a5f7a;">
        <h3 class="mb-0">Pickup Goods</h3>
    </div>

    <div class="card-body">

        <h5 class="mb-4">
            Customer:
            <strong>{{ customer.full_name }}</strong>
        </h5>
        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Product</label>

                <select name="product" class="form-select">

                    <option value="">
                        Select Product
                    </option>

                    {% for product in products %}
                       <option value="{{ product.id }}">{{ product.product_name }} | {{ product.category_name.category_name }} | {{ product.unit_price }} | Stock {{ product.current_stock }}</option>
                    {% endfor %}

                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Quantity</label>

                <input type="text" name="quantity" class="form-control">
            </div>

            <button type="submit" class="btn btn-primary">
                Confirm Pickup
            </button>

            <a href="{% url 'customer_scheme_detail' customer.id %}" class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
